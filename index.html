<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Разрешающий CSP для GitHub Pages -->
    <meta http-equiv="Content-Security-Policy" 
          content="default-src 'self'; 
                   script-src 'self' 'unsafe-inline' https://unpkg.com https://*.vk.com https://*.vkuser.net; 
                   style-src 'self' 'unsafe-inline'; 
                   connect-src 'self' https://*.vk.com https://*.vkuser.net https://unpkg.com; 
                   img-src 'self' data: https:; 
                   frame-src https://*.vk.com;">
    
    <title>Авторизация VK ID - Social Reposter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 { font-size: 1.5rem; color: #222; margin-bottom: 1.5rem; margin-top: 0; }
        #vkid-widget-container { min-height: 80px; display: flex; justify-content: center; align-items: center; margin-bottom: 1rem; }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
            padding: 8px;
            border-radius: 6px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Вход в Social Reposter</h1>
        <div id="vkid-widget-container"></div>
        <div id="status" class="status">Загрузка виджета...</div>
    </div>

    <script src="https://unpkg.com/@vkid/sdk@2.6.10/dist-sdk/umd/index.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if ('VKIDSDK' in window) {
                const VKID = window.VKIDSDK;

                VKID.Config.init({
                    app: 54899077,
                    redirectUrl: 'https://dennydaytona.github.io/socialreposter/',
                    responseMode: VKID.ConfigResponseMode.Callback,
                    source: VKID.ConfigSource.LOWCODE,
                    scope: '',
                });

                const floatingOneTap = new VKID.FloatingOneTap();

                floatingOneTap.render({
                    container: document.getElementById('vkid-widget-container'),
                    appName: 'Social Reposter',
                    showAlternativeLogin: true
                })
                .on(VKID.WidgetEvents.ERROR, vkidOnError)
                .on(VKID.FloatingOneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
                    updateStatus('Обмен кода на токен...', '#0055FF');
                    VKID.Auth.exchangeCode(payload.code, payload.device_id)
                        .then(vkidOnSuccess)
                        .catch(vkidOnError);
                });
            
                function vkidOnSuccess(data) {
                    floatingOneTap.close();
                    // Сохраняем токен в localStorage
                    if (data && data.access_token) {
                        localStorage.setItem('vk_access_token', data.access_token);
                        localStorage.setItem('vk_user_id', data.user_id);
                    }
                    updateStatus('✅ Успешная авторизация! Перенаправление...', '#28a745');
                    
                    // Перенаправляем на главную страницу приложения
                    setTimeout(() => {
                        window.location.href = '/socialreposter/dashboard';
                    }, 1500);
                }
            
                function vkidOnError(error) {
                    updateStatus('❌ Ошибка авторизации. Проверьте настройки VK ID.', '#dc3545');
                    console.error('VK ID Error:', error);
                }

                function updateStatus(message, color = '#666') {
                    const statusEl = document.getElementById('status');
                    statusEl.textContent = message;
                    statusEl.style.color = color;
                }
            } else {
                updateStatus('Ошибка загрузки SDK', '#dc3545');
            }
        });
    </script>
</body>
</html>
