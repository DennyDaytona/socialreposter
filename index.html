<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация VK ID - Social Reposter</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: white;
            padding: 2rem;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        h1 {
            font-size: 1.5rem;
            color: #222;
            margin-bottom: 1.5rem;
            margin-top: 0;
        }
        #vkid-widget-container {
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 1rem;
        }
        .status {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
            padding: 8px;
            border-radius: 6px;
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Вход в Social Reposter</h1>
        
        <!-- Контейнер для виджета VK ID -->
        <div id="vkid-widget-container"></div>
        
        <!-- Блок для отображения статуса авторизации -->
        <div id="status" class="status">Загрузка виджета авторизации...</div>
    </div>

    <!-- 
        ВАЖНО: 
        1. Версия SDK изменена с "<3.0.0" на "2.6.10", так как unpkg не поддерживает 
           символы "<" и ">" в URL. 
        2. Атрибут nonce удалён для корректной работы локально. 
           Если вы используете Content Security Policy (CSP), добавьте его обратно 
           в формате: nonce="ВАШ_РЕАЛЬНЫЙ_СГЕНЕРИРОВАННЫЙ_NONCE"
    -->
    <script src="https://unpkg.com/@vkid/sdk@2.6.10/dist-sdk/umd/index.js"></script>
    
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', function() {
            if ('VKIDSDK' in window) {
                const VKID = window.VKIDSDK;

                // 1. Инициализация конфигурации
                VKID.Config.init({
                    app: 54899077,
                    redirectUrl: 'https://dennydaytona.github.io/socialreposter/',
                    responseMode: VKID.ConfigResponseMode.Callback,
                    source: VKID.ConfigSource.LOWCODE,
                    scope: '', // Заполните нужными доступами по необходимости (например, 'email,phone')
                });

                // 2. Создание экземпляра виджета
                const floatingOneTap = new VKID.FloatingOneTap();

                // 3. Отрисовка виджета
                floatingOneTap.render({
                    container: document.getElementById('vkid-widget-container'), // Привязка к контейнеру
                    appName: 'Social Reposter',
                    showAlternativeLogin: true
                })
                .on(VKID.WidgetEvents.ERROR, vkidOnError)
                .on(VKID.FloatingOneTapInternalEvents.LOGIN_SUCCESS, function (payload) {
                    const code = payload.code;
                    const deviceId = payload.device_id;

                    updateStatus('Обмен кода на токен...', '#0055FF');

                    // 4. Обмен кода на токен
                    VKID.Auth.exchangeCode(code, deviceId)
                        .then(vkidOnSuccess)
                        .catch(vkidOnError);
                });
            
                // Обработчик успешной авторизации
                function vkidOnSuccess(data) {
                    floatingOneTap.close();
                    updateStatus('✅ Авторизация успешна!', '#28a745');
                    console.log('Успешная авторизация, данные:', data);
                    
                    // TODO: Здесь добавьте сохранение токена (например, в localStorage) 
                    // и редирект на основную страницу приложения:
                    // window.location.href = '/dashboard';
                }
            
                // Обработчик ошибок
                function vkidOnError(error) {
                    updateStatus('❌ Ошибка авторизации. Попробуйте снова.', '#dc3545');
                    console.error('Ошибка VK ID:', error);
                }

                // Вспомогательная функция для обновления статуса на экране
                function updateStatus(message, color = '#666') {
                    const statusEl = document.getElementById('status');
                    statusEl.textContent = message;
                    statusEl.style.color = color;
                    statusEl.style.backgroundColor = color + '15'; // Добавляем 15% прозрачности к цвету фона
                }

            } else {
                console.error('VKID SDK не загружен. Проверьте подключение к интернету или блокировщики рекламы.');
                updateStatus('Ошибка загрузки SDK.', '#dc3545');
            }
        });
    </script>
</body>
</html>
